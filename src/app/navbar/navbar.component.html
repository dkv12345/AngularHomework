<header class="app-header">
  <div class="nav-container">
    <!-- Brand / Course Info -->
    <a routerLink="/" class="brand-link" (click)="closeMenu()">
      <div class="brand-icon">🅰️</div>
      <div class="brand-info">
        <span class="brand-name">Angular Homework Portal</span>
        <span class="brand-dept">UEL • Khoa Hệ Thống Thông Tin</span>
      </div>
    </a>

    <!-- Mobile Toggle -->
    <button class="menu-toggle" (click)="toggleMenu()" aria-label="Toggle navigation">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <!-- Nav Links -->
    <nav class="nav-menu" [class.open]="isMenuOpen">
      <a 
        routerLink="/" 
        routerLinkActive="active" 
        [routerLinkActiveOptions]="{exact: true}"
        (click)="closeMenu()" 
        class="nav-link">
        <span>Tổng quan</span>
      </a>

      <a 
        routerLink="/service-product-image-event" 
        routerLinkActive="active" 
        (click)="closeMenu()" 
        class="nav-link">
        <span>Exercise 13</span>
      </a>

      <a 
        routerLink="/service-product-catalog" 
        routerLinkActive="active" 
        (click)="closeMenu()" 
        class="nav-link">
        <span>Exercise 14</span>
      </a>

      <a 
        routerLink="/service-group-customer" 
        routerLinkActive="active" 
        (click)="closeMenu()" 
        class="nav-link">
        <span>Exercise 18</span>
      </a>

      <a 
        routerLink="/docs" 
        routerLinkActive="active" 
        (click)="closeMenu()" 
        class="nav-link highlight">
        <span>📖 Tài liệu & Lý thuyết</span>
      </a>
    </nav>
  </div>
</header>
